<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Executivo • Transpetro 2026</title>
  <style>
    :root {
      --bg: #f0fdf4;
      --card: #ffffff;
      --primary: #008542; /* Verde Transpetro */
      --primary-dark: #006331; 
      --accent: #d97706; /* Amarelo Ouro */
      --danger: #ef4444; 
      --success: #16a34a; 
      --text: #062315; 
      --subtext: #475569; 
      --border: #bbf7d0; 
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(0, 133, 66, 0.08);
      border: 1px solid var(--border);
      text-align: center;
      margin-bottom: 14px;
    }
    .card-header {
      background: linear-gradient(135deg, #008542 0%, #004d25 100%);
      color: white;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 3px 8px rgba(0, 133, 66, 0.2);
    }
    .card-header h1 { font-size: 1.3rem; margin: 0 0 4px 0; text-transform: uppercase; letter-spacing: 0.5px; }
    .card-header p { color: #dcfce7; font-size: 0.8rem; margin: 0; }
    
    h2 { font-size: 1.1rem; color: var(--primary); margin: 0 0 10px 0; text-align: left; border-bottom: 2px solid var(--border); padding-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 0.9rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s;
      margin-top: 6px;
    }
    button:active { transform: scale(0.98); }
    .btn-main { background: var(--primary); color: white; }
    .btn-main:hover { background: var(--primary-dark); }
    .btn-stop { background: var(--danger); color: white; }
    .btn-next { background: #0284c7; color: white; }
    .btn-sec { background: #e2e8f0; color: #334155; font-size: 0.85rem; padding: 10px; }
    .btn-status { background: var(--accent); color: white; }

    .q-title { font-weight: bold; font-size: 1rem; text-align: left; margin-bottom: 12px; line-height: 1.4; }
    .tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      background: #dcfce7;
      color: #15803d;
      margin-bottom: 12px;
    }
    .option-btn {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: var(--text);
      text-align: left;
      font-weight: normal;
      font-size: 0.9rem;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
    }
    .correct { background: var(--success) !important; color: white !important; border-color: var(--success) !important; }
    .wrong { background: var(--danger) !important; color: white !important; border-color: var(--danger) !important; }

    .feedback {
      text-align: left;
      background: #f8fafc;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 12px;
      border: 1px solid var(--border);
      line-height: 1.5;
    }
    
    .status-box {
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 10px 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      text-align: left;
      font-size: 0.85rem;
    }
    .status-box b { color: var(--primary); }
    
    .panorama-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      text-align: left;
      font-size: 0.82rem;
    }
    .panorama-box h3 { font-size: 0.9rem; color: var(--primary); margin: 0 0 6px 0; }
  </style>
</head>
<body>
  <div class="container">

    <!-- TELA 1: INÍCIO / PANORAMA -->
    <div class="card" id="screenHome">
      <div class="card-header">
        <h1>⚓ Rota Transpetro 2026</h1>
        <p>Painel Executivo de Preparação Intensiva</p>
      </div>

      <div class="panorama-box" id="homePanorama">
        <h3>Panorama Geral da Preparação</h3>
        <div id="panoramaContent">Carregando dados...</div>
      </div>

      <div style="margin-bottom: 10px;">
        <input type="password" id="apiKey" placeholder="Chave de API do Gemini...">
      </div>

      <button id="startBtn" class="btn-main">🚀 Começar a Estudar Agora</button>
      <button id="statusBtn" class="btn-status">📈 Ver Relatórios & Performance</button>
      
      <!-- Botões de Backup e Restauração -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px;">
        <button id="exportBtn" class="btn-sec">📥 Baixar Backup</button>
        <button id="importTriggerBtn" class="btn-sec">📤 Restaurar Backup</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none;">
    </div>

    <!-- TELA 2: MODO ESTUDO -->
    <div class="card" id="screenStudy" style="display:none; text-align:left;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="tag" id="qTag">CARREGANDO...</span>
        <span style="font-size:0.8rem; color:#64748b;" id="sessionCounter">Sessão: 0 q</span>
      </div>
      
      <div class="q-title" id="qText">Gerando questão...</div>
      <div id="optionsBox"></div>
      <div class="feedback" id="feedbackBox" style="display:none;"></div>

      <div id="actionBtns" style="display:none; margin-top:16px;">
        <button id="nextBtn" class="btn-next">➡️ Próxima Questão</button>
        <button id="stopBtn" class="btn-stop">⏹️ Encerrar Sessão & Ver Painel</button>
      </div>
    </div>

    <!-- TELA 3: PAINEL DE STATUS E PERFORMANCE -->
    <div class="card" id="screenStatus" style="display:none; text-align:left;">
      <h2>📊 Relatórios & Performance</h2>
      
      <div class="panorama-box">
        <h3>⏳ Prazos & Metas de Questões</h3>
        <div id="deadlinesContent">Calculando metas...</div>
      </div>

      <div class="panorama-box">
        <h3>📈 Desempenho por Período</h3>
        <div id="performanceContent">Calculando histórico...</div>
      </div>

      <div id="concursoStatusList"></div>

      <button id="backHomeBtn" class="btn-main" style="margin-top:10px;">🔄 Voltar ao Início</button>
    </div>

  </div>

  <script>
    let currentData = null;
    let currentTopic = "";
    let sessionCount = 0;

    const topicMap = {
      "Transpetro: Analista SAP (MM e Integrações)": { concurso: "Transpetro (SAP)", peso: 50, metaTeoria: new Date("2026-11-15"), metaQ: 400 },
      "Transpetro: Mecânico de Manutenção": { concurso: "Transpetro (Mecânico)", peso: 30, metaTeoria: new Date("2026-11-15"), metaQ: 300 },
      "Dataprev: Analista de Informação (Dados/BI)": { concurso: "Dataprev (Info)", peso: 20, metaTeoria: new Date("2026-09-27"), metaQ: 250 }
    };
    const topicsList = Object.keys(topicMap);

    const savedKey = localStorage.getItem('gemini_key') || '';
    if(savedKey) { document.getElementById('apiKey').value = savedKey; }

    function getData() { 
      return JSON.parse(localStorage.getItem('study_data_v4') || '{"stats":{}, "history":[]}'); 
    }
    
    function saveData(data) { 
      localStorage.setItem('study_data_v4', JSON.stringify(data)); 
      updateHomePanorama();
    }

    function getNextTopic() {
      const rand = Math.random() * 100;
      if (rand < 50) return "Transpetro: Analista SAP (MM e Integrações)";
      if (rand < 80) return "Transpetro: Mecânico de Manutenção";
      return "Dataprev: Analista de Informação (Dados/BI)";
    }

    function showScreen(screenId) {
      document.getElementById('screenHome').style.display = screenId === 'home' ? 'block' : 'none';
      document.getElementById('screenStudy').style.display = screenId === 'study' ? 'block' : 'none';
      document.getElementById('screenStatus').style.display = screenId === 'status' ? 'block' : 'none';
      if(screenId === 'home') updateHomePanorama();
    }

    function updateHomePanorama() {
      const db = getData();
      let totalQ = 0, totalA = 0;
      Object.keys(db.stats).forEach(t => {
        totalQ += db.stats[t].q;
        totalA += db.stats[t].a;
      });
      const rate = totalQ > 0 ? Math.round((totalA / totalQ) * 100) : 0;

      const today = new Date();
      const diasDataprev = Math.max(0, Math.ceil((new Date("2026-10-11") - today) / (1000 * 60 * 60 * 24)));
      const diasTranspetro = Math.max(0, Math.ceil((new Date("2026-11-29") - today) / (1000 * 60 * 60 * 24)));

      document.getElementById('panoramaContent').innerHTML = `
        • <b>Total de Questões Feitas:</b> ${totalQ} (${rate}% de acertos)<br>
        • <b>Dias para Dataprev (11/10):</b> ${diasDataprev} dias restantes<br>
        • <b>Dias para Transpetro (29/11):</b> ${diasTranspetro} dias restantes
      `;
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      const keyInput = document.getElementById('apiKey').value.trim();
      if(!keyInput) return alert('Cole a sua chave de API primeiro!');
      localStorage.setItem('gemini_key', keyInput);
      showScreen('study');
      fetchNextQuestion();
    });

    document.getElementById('statusBtn').addEventListener('click', () => {
      renderStatusDashboard();
      showScreen('status');
    });

    // Funcionalidade de Backup (Download)
    document.getElementById('exportBtn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(localStorage.getItem('study_data_v4') || '{"stats":{}, "history":[]}');
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `backup_transpetro_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click(); 
      dlAnchor.remove();
    });

    // Funcionalidade de Restauração de Backup (Upload)
    document.getElementById('importTriggerBtn').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed && parsed.stats) {
            localStorage.setItem('study_data_v4', evt.target.result);
            updateHomePanorama();
            alert('Backup restaurado com sucesso! Seus dados foram atualizados. 🎉');
          } else {
            alert('O arquivo selecionado não possui um formato de backup válido.');
          }
        } catch(err) {
          alert('Erro ao ler o arquivo de backup.');
        }
      };
      reader.readAsText(file);
    });

    async function fetchNextQuestion() {
      const key = (localStorage.getItem('gemini_key') || '').trim();
      currentTopic = getNextTopic();
      
      document.getElementById('qTag').innerText = currentTopic.split(':')[0];
      document.getElementById('qText').innerText = "⚡ Gerando questão oficial...";
      document.getElementById('optionsBox').innerHTML = "";
      document.getElementById('feedbackBox').style.display = "none";
      document.getElementById('actionBtns').style.display = "none";

      const prompt = `Atue como examinador da Cesgranrio. Gere 1 questão de múltipla escolha para: "${currentTopic}". 
Priorize questão real da Cesgranrio ou variação fiel.
Responda EXCLUSIVAMENTE em formato JSON puro, sem crases markdown ou texto extra:
{
  "type": "REAL CESGRANRIO",
  "question": "Enunciado completo",
  "options": ["A) texto", "B) texto", "C) texto", "D) texto", "E) texto"],
  "answer": 0,
  "explanation": "Gabarito fundamentado com análise de cada alternativa (A, B, C, D, E) e tradução de siglas em inglês."
}`;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${key}`;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error?.message || `HTTP ${res.status}`);
        }

        const data = await res.json();
        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/gi, '').replace(/
